# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Domain\Repository\UserRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\UserDoctrineRepository'
    App\Domain\Repository\BookRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\BookDoctrineRepository'
    App\Domain\Repository\UserBookRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\UserBookDoctrineRepository'
    App\Domain\Repository\ReadingClubRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\ReadingClubDoctrineRepository'
    App\Domain\Repository\ChapterRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\ChapterDoctrineRepository'
    App\Domain\Repository\ClubMembershipRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\ClubMembershipDoctrineRepository'
    App\Domain\Repository\DiscussionRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\DiscussionDoctrineRepository'
    App\Domain\Repository\ReportRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\ReportDoctrineRepository'
    App\Domain\Repository\ReviewRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\ReviewDoctrineRepository'
    App\Application\Port\PasswordHasherInterface: '@App\Infrastructure\Security\SymfonyPasswordHasher'
